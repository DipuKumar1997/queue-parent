spring.application.name=chat-service

server.port=8082
#host.docker.internal:9092
#spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.bootstrap-servers=host.docker.internal:9092
#spring.kafka.bootstrap-servers=192.168.117.71:9092
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.data.mongodb.uri=mongodb://localhost:27017/chatdb
#spring.websocket.allow-origin=*
#auth.service.url=http://localhost:8084/api/v1/auth

