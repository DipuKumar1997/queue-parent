server.port=8084
spring.cloud.gateway.httpclient.websocket.proxy-ping=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=chat-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
#spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/chat/**
#spring.cloud.gateway.routes[1].predicates[1]=Path=/api/v1/users/**
#spring.cloud.gateway.routes[1].predicates[2]=Path=/ws/**
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/chat/**,/api/v1/users/**,/ws/**
spring.cloud.gateway.routes[1].filters[0]=CustomAuth

logging.level.reactor.netty=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
