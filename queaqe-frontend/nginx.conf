server {
    listen 80;

    # 1. React SPA Route Fallback (Fixes 404 on /chat refresh)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. REST API Requests (Forwards JWT and headers to API Gateway)
    location /api/ {
        proxy_pass http://api-gateway.queue.internal:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # 3. WebSocket Connection Proxy (For Real-Time Chat /ws)
    location /ws/ {
        proxy_pass http://api-gateway.queue.internal:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}