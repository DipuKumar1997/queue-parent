<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test for API Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #1a202c;
            font-size: 1.875rem; /* 30px */
            margin-bottom: 20px;
            font-weight: 700;
        }
        p {
            color: #4a5568;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        button {
            background-image: linear-gradient(to right, #6366f1, #8b5cf6);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.4);
        }
        #result-message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
        }
        .success {
            background-color: #d1fae5; /* green-100 */
            color: #065f46; /* green-700 */
            border: 1px solid #10b981; /* green-500 */
        }
        .error {
            background-color: #fee2e2; /* red-100 */
            color: #991b1b; /* red-700 */
            border: 1px solid #ef4444; /* red-500 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CORS Test for API Gateway</h1>
        <p>Click the button below to send a POST request to your API Gateway. Check your browser's console for detailed results on the CORS response.</p>
        <button id="testCorsButton">Test CORS</button>
        <div id="result-message" class="hidden"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const testCorsButton = document.getElementById('testCorsButton');
            const resultMessage = document.getElementById('result-message');

            // Define the target URL for the POST request
            const apiUrl = 'http://localhost:8084/api/v1/auth/send-otp';

            // Define dummy data to send with the POST request
            // Replace with actual data structure expected by your /send-otp endpoint if known
            const requestBody = JSON.stringify({
                phoneNumber: '+919876543210' // Example phone number, adjust as needed
            });

            // Function to display messages on the UI
            function displayMessage(message, type) {
                resultMessage.textContent = message;
                resultMessage.className = `block ${type}`; // Use block to make it visible, and apply color class
            }

            testCorsButton.addEventListener('click', async () => {
                resultMessage.className = 'hidden'; // Hide previous message

                console.log(`Attempting to send POST request to: ${apiUrl}`);
                console.log(`Request Body: ${requestBody}`);

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        // 'cors' mode is the default for cross-origin requests, but explicitly stating it
                        // makes the intent clear. It ensures the browser follows CORS protocol.
                        mode: 'cors',
                        headers: {
                            'Content-Type': 'application/json',
                            // Add any other headers your API expects, e.g., Authorization token if applicable
                            // 'Authorization': 'Bearer your_token_here'
                        },
                        body: requestBody // Attach the JSON stringified body
                    });

                    // Check if the response is OK (status in the range 200-299)
                    if (response.ok) {
                        const data = await response.json(); // Attempt to parse response as JSON
                        console.log('Request successful! Response:', data);
                        displayMessage('CORS check passed: Request successful!', 'success');
                    } else {
                        // If response is not OK, it indicates an HTTP error (e.g., 404, 500)
                        // This typically means CORS was handled, but the server responded with an error status.
                        const errorText = await response.text(); // Get raw text for error
                        console.error(`Request failed with status ${response.status}: ${errorText}`);
                        displayMessage(`CORS check failed (Server Error): Status ${response.status}`, 'error');
                    }
                } catch (error) {
                    // This catch block handles network errors or actual CORS blocking.
                    // If the browser blocks the request due to CORS policy, the `fetch` promise
                    // will reject, and this block will be executed.
                    console.error('Fetch error (could be CORS or network issue):', error);
                    displayMessage(`CORS check failed: ${error.message}. Check console for details.`, 'error');
                    if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                        console.error('This often indicates a CORS policy block if the server is running but not responding.');
                    }
                }
                console.log('--- End of CORS Test ---');
            });
        });
    </script>
</body>
</html>
