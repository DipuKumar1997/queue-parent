<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test Frontend</title>
    <!-- Tailwind CSS CDN for basic styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the Inter font and overall layout */
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f4f8; /* Light blue-gray background */
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .message-box {
            background-color: #e2e8f0; /* Light gray background */
            border: 1px solid #cbd5e1; /* Gray border */
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #334155; /* Darker text */
            word-wrap: break-word; /* Ensure text wraps */
            white-space: pre-wrap; /* Preserve whitespace and line breaks */
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-6">CORS Test Frontend</h1>
        <p class="text-gray-600 mb-8">Click the button to make a request to your backend at `http://localhost:8084/api/v1/test/ping`. Open your browser's developer console (F12 or Cmd+Option+I) to see the response.</p>

        <button id="pingButton" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75">
            Ping Backend
        </button>

        <div id="responseMessage" class="message-box">
            No request made yet.
        </div>
    </div>

    <script>
        document.getElementById('pingButton').addEventListener('click', async () => {
            const responseMessageDiv = document.getElementById('responseMessage');
            responseMessageDiv.textContent = 'Making request...';
            console.log('Attempting to fetch from http://localhost:8084/api/v1/test/ping');

            try {
                // Fetch request to your backend endpoint
                const res = await fetch("http://localhost:8084/api/v1/test/ping", {
                    method: "GET"
                });

                // Log the status and headers to the console
                console.log("Response Status:", res.status);
                // The headers are logged as a Headers object, which can be iterated or converted to an object
                console.log("Response Headers:", res.headers);
                for (let [key, value] of res.headers) {
                    console.log(`  ${key}: ${value}`);
                }

                const text = await res.text();
                console.log("Response Body:", text);

                // Display a summary in the message box
                if (res.ok) { // res.ok is true for 200-299 status codes
                    responseMessageDiv.textContent = `Success! Status: ${res.status}\nBody: ${text}`;
                    responseMessageDiv.classList.remove('bg-red-200', 'border-red-400');
                    responseMessageDiv.classList.add('bg-green-100', 'border-green-300');
                } else {
                    responseMessageDiv.textContent = `Error! Status: ${res.status}\nBody: ${text}`;
                    responseMessageDiv.classList.remove('bg-green-100', 'border-green-300');
                    responseMessageDiv.classList.add('bg-red-200', 'border-red-400');
                }

            } catch (err) {
                console.error("Fetch Error:", err);
                responseMessageDiv.textContent = `An error occurred: ${err.message}. Check your backend and network connection.`;
                responseMessageDiv.classList.remove('bg-green-100', 'border-green-300');
                responseMessageDiv.classList.add('bg-red-200', 'border-red-400');
            }
        });
    </script>
</body>
</html>
