version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: authdb
    ports:
      - "3306:3306"

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    depends_on:
      - mysql

  chat-service:
    build: ./chat-service
    ports:
      - "8082:8082"
    depends_on:
      - mongodb

  frontend:
    build: ./queaqe-frontend
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - chat-service